<div class="duo-email-preview">
  <style>
    .duo-email-preview { max-width: 760px; }
    .duo-email-preview .dep-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 10px; }
    .duo-email-preview .dep-tab { border:1px solid #d0d7de; background:#fff; color:#333; padding:6px 14px; border-radius:999px; cursor:pointer; font-size:13px; }
    .duo-email-preview .dep-tab.active { background:#e84a7a; border-color:#e84a7a; color:#fff; }
    .duo-email-preview .dep-actions { margin-left:auto; display:flex; gap:8px; }
    .duo-email-preview .dep-link { display:inline-block; padding:6px 14px; border-radius:999px; border:1px solid #d0d7de; font-size:13px; text-decoration:none; background:#fff; color:#333; cursor:pointer; }
    .duo-email-preview .dep-frame-wrap { background:#0b0b10; border-radius:14px; padding:18px; display:flex; justify-content:center; }
    .duo-email-preview iframe { width:100%; height:720px; border:0; border-radius:10px; background:#111; transition:width .2s ease; }
    .duo-email-preview .dep-frame-wrap.mobile iframe { width:390px; }
    .duo-email-preview pre { white-space:pre-wrap; background:#f6f8fa; border:1px solid #d0d7de; border-radius:10px; padding:16px; font-size:13px; line-height:1.55; max-height:720px; overflow:auto; margin:0; }
    .duo-email-preview .dep-hint { color:#6b7280; font-size:12px; margin-top:8px; }
  </style>

  <div class="dep-bar">
    <button type="button" class="dep-tab active" data-view="desktop">Desktop</button>
    <button type="button" class="dep-tab" data-view="mobile">Mobile</button>
    <button type="button" class="dep-tab" data-view="text">Plain text</button>
    <span class="dep-actions">
      <a class="dep-link" href="{{ full_url }}" target="_blank" rel="noopener">Open full page ↗</a>
      <button type="submit" class="dep-link" formaction="{{ send_test_url }}" formmethod="post" formnovalidate>Send test to me</button>
    </span>
  </div>

  <div class="dep-frame-wrap" data-panel="frame">
    <iframe srcdoc="{{ html }}" title="Email preview"></iframe>
  </div>
  <pre data-panel="text" hidden>{{ text }}</pre>
  <p class="dep-hint">Shown with sample data. Save your changes to refresh the preview.</p>

  <script>
    (function () {
      var root = document.currentScript.parentElement;
      var wrap = root.querySelector('[data-panel="frame"]');
      var text = root.querySelector('[data-panel="text"]');
      root.querySelectorAll('.dep-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          root.querySelectorAll('.dep-tab').forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
          var view = tab.dataset.view;
          wrap.hidden = view === 'text';
          text.hidden = view !== 'text';
          wrap.classList.toggle('mobile', view === 'mobile');
        });
      });
    })();
  </script>
</div>
